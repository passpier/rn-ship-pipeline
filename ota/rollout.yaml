# Production OTA rollout (design §5). Each step needs `rnship release approve update` and a
# passing health window first. A window with fewer than min_sessions sessions on the new
# update is inconclusive: it never auto-passes, and you decide.
version: 1
steps: [10, 25, 50, 100]
window_hours: 24
min_sessions: 50
crash_free_sessions_min: 0.995
